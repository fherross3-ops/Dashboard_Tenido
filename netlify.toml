[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# API de comentarios → Netlify Function
[[redirects]]
  from = "/api/comentario"
  to = "/.netlify/functions/comentario"
  status = 200

# CSVs de producción y tiempos: cache corto
[[headers]]
  for = "/data/*.csv"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "text/csv; charset=utf-8"
    Access-Control-Allow-Origin = "*"

# comentarios.csv: nunca cachear (se escribe desde la función)
[[headers]]
  for = "/data/comentarios.csv"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/csv; charset=utf-8"

# HTML: siempre revalidar
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
